name: Regenerate UI Missing Assets

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/generate_ui_missing_assets.py'
      - '.github/workflows/regenerate-ui-assets.yml'

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate and validate assets
        run: python tools/generate_ui_missing_assets.py

      - name: Commit generated PNGs and fixed ZIP
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/UIAssets/SlayTheSpireDemo_UI_MissingAssets docs/UIAssets/SlayTheSpireDemo_UI_MissingAssets.zip
          if git diff --cached --quiet; then
            echo 'No generated asset changes.'
            exit 0
          fi
          git commit -m '修复并展开战斗UI素材包 [skip ci]'
          git push
