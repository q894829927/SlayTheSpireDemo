name: Runner Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows, x64, ue58]
    timeout-minutes: 15

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Verify trusted execution context
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -ne "workflow_dispatch") {
              throw "This self-hosted workflow must only run via workflow_dispatch."
          }
          if ("${{ github.actor }}" -ne "${{ github.repository_owner }}") {
              throw "Only the repository owner may run this self-hosted workflow."
          }
          if ("${{ github.ref }}" -ne "refs/heads/main") {
              throw "This self-hosted workflow may only run from main."
          }

      - name: System Info
        shell: powershell
        run: |
          Write-Host "Runner OK"
          Write-Host "Computer: $env:COMPUTERNAME"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          Get-Location

      - name: Check Unreal Engine
        shell: powershell
        run: |
          $UE = "E:\Unreal engine\UE_5.8"
          if (!(Test-Path "$UE\Engine\Build\BatchFiles\Build.bat")) {
              throw "UE5.8 Build.bat not found"
          }
          if (!(Test-Path "$UE\Engine\Binaries\Win64\UnrealEditor-Cmd.exe")) {
              throw "UnrealEditor-Cmd.exe not found"
          }
          Write-Host "UE5.8 found."
