name: Append UI-A2E detailed section

on:
  push:
    branches:
      - main
    paths:
      - docs/.uia2e-detailed-section.tmp.md

permissions:
  contents: write

jobs:
  append-section:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append section and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          printf '\n' >> docs/UIA2EDetailedImplementationSteps.zh-CN.md
          cat docs/.uia2e-detailed-section.tmp.md >> docs/UIA2EDetailedImplementationSteps.zh-CN.md
          git rm docs/.uia2e-detailed-section.tmp.md
          git rm .github/workflows/append-uia2e-detailed-section.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/UIA2EDetailedImplementationSteps.zh-CN.md
          git commit -m "docs(ui-a2e): 记录详细实施步骤第七节"
          git push
